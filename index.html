<!DOCTYPE html>
<html>
<head>
  <title>Stockguru</title>

  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(135deg, #1e1e2f, #2b5876);
      color: white;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(0,0,0,0.5);
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #00ffcc;
    }

    .menu a {
      color: white;
      margin-left: 15px;
      text-decoration: none;
    }

    /* Hero section */
    .hero {
      text-align: center;
      margin-top: 100px;
    }

    .hero h1 {
      font-size: 40px;
      color: #00ffcc;
    }

    .hero p {
      color: #ccc;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      border: none;
      border-radius: 20px;
      background: #ff4757;
      color: white;
      cursor: pointer;
    }

    /* Cards */
    .cards {
      display: flex;
      justify-content: center;
      margin-top: 50px;
      gap: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: rgba(255,255,255,0.1);
      padding: 20px;
      border-radius: 15px;
      width: 200px;
      text-align: center;
    }
  </style>

</head>

<body>

  <!-- Navbar -->
  <div class="navbar">
    <div class="logo">Stockguru 📈</div>
    <div class="menu">
      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </div>
  </div>

  <!-- Hero -->
  <div class="hero">
    <h1>Welcome to Stockguru 🚀</h1>
    <p>Learn and track stocks easily</p>
    <button class="btn">Get Started</button>
  </div>

  <!-- Cards -->
  <div class="cards">
    <div class="card">📊 Live Stocks</div>
    <div class="card">📈 Analysis</div>
    <div class="card">💡 Tips</div>
  </div>

</body>
</html><button class="btn" onclick="alert('Welcome to Stockguru 🚀')">
  Get Started
</button><button class="btn">Get Started</button>
